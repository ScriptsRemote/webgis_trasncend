<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRANSCEND · WebGIS</title>
<link rel="icon" type="image/png" href="assets/logo-uom.png">
<script src="js/tema.js?v=20261102b"></script>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet-geoman.css">
<link rel="stylesheet" href="css/style.css?v=20261102b">
</head>
<body>
<div id="carregando-app" class="carregando-app" role="status"><span class="spinner"></span><span data-i18n="loadingApp">Cargando el WebGIS…</span></div>

<div id="shell">

  <aside id="sidebar">
    <div class="sidebar-sheet">
      <header class="side-head">
        <div class="brand">
          <span class="brand-lockup">
            <img src="assets/logo-uom.png" alt="The University of Manchester" class="brand-mark">
          </span>
          <div class="brand-acoes">
            <div class="idioma" role="group" data-i18n-aria="langGroup" aria-label="Idioma">
              <button type="button" class="idioma-btn" data-lang="es" aria-pressed="true">ES</button>
              <button type="button" class="idioma-btn" data-lang="en" aria-pressed="false">EN</button>
            </div>
            <button type="button" class="sino-btn tema-btn" data-alternar-tema aria-pressed="false"
                    data-i18n-title="themeToggle" title="Cambiar tema" data-i18n-aria="themeToggle" aria-label="Cambiar tema">
              <svg class="tema-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8 8 0 1 1 9.4 4a6.4 6.4 0 0 0 10.6 10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              <svg class="tema-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <button type="button" id="btn-ajuda" class="sino-btn"
                    data-i18n-title="helpOpen" title="Guía de uso" data-i18n-aria="helpOpen" aria-label="Guía de uso">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
        <div class="brand-sub">
          <h1>TRANSCEND · WebGIS</h1>
          <span data-i18n="subtitle">Cuenca del lago Titicaca · Perú y Bolivia</span>
        </div>
      </header>

      <nav class="side-icons" role="tablist" data-i18n-aria="tabsLabel" aria-label="Paneles">
        <button type="button" class="side-icon is-on" data-side="camadas" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span data-i18n="tabLayers">Capas</span>
        </button>
        <button type="button" class="side-icon" data-side="explorar" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-i18n="tabExplore">Explorar</span>
        </button>
        <button type="button" class="side-icon" data-side="validar" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.3 10l1.9 1.9 3.6-3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="tabValidate">Validar</span>
        </button>
        <button type="button" class="side-icon" data-side="sobre" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-i18n="tabAbout">Acerca de</span>
        </button>
      </nav>

      <!-- Capas -->
      <section id="painel-camadas" class="side-panel legend" data-painel="camadas">
        <div class="legend-bar">
          <div class="legend-title" data-i18n="layersTitle">Capas del mapa</div>
          <button type="button" id="btn-legend-recolher" class="legend-btn" data-i18n-title="collapseAll" title="Recoger todas las secciones">▾</button>
        </div>
        <div id="legend-body" class="legend-body"></div>
      </section>

      <!-- Explorar -->
      <section id="painel-explorar" class="side-panel" data-painel="explorar" hidden>
        <div class="painel-pad">
          <label class="campo-rotulo" for="busca-mun" data-i18n="searchLabel">Buscar municipio o distrito</label>
          <div class="busca">
            <input id="busca-mun" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="Escriba un nombre…">
            <ul id="busca-lista" class="busca-lista" role="listbox" hidden></ul>
          </div>
          <div class="filtro-pais" role="group" data-i18n-aria="countryFilter" aria-label="País">
            <button type="button" class="chip is-on" data-pais="all" data-i18n="all">Todos</button>
            <button type="button" class="chip" data-pais="Peru">Perú</button>
            <button type="button" class="chip" data-pais="Bolivia">Bolivia</button>
          </div>
          <div id="ficha" class="ficha" hidden></div>
          <div id="resumo" class="resumo"></div>
          <button type="button" id="btn-bacia" class="btn btn-sec" data-i18n="zoomBasin">Ver toda la cuenca</button>
        </div>
      </section>

      <!-- Validar (js/validacao.js) -->
      <section id="painel-validar" class="side-panel" data-painel="validar" hidden>
        <div class="painel-pad" id="validar-corpo"></div>
      </section>

      <!-- Acerca de -->
      <section id="painel-sobre" class="side-panel" data-painel="sobre" hidden>
        <div class="painel-pad sobre" id="sobre-corpo"></div>
      </section>

      <footer class="side-foot">
        <span data-i18n="footer">Proyecto TRANSCEND · The University of Manchester</span>
      </footer>
    </div>
    <button type="button" id="btn-sidebar-toggle" class="sidebar-toggle" aria-expanded="true" aria-controls="sidebar">
      <span class="sidebar-toggle-icon" aria-hidden="true">‹</span>
      <span class="sidebar-toggle-label" data-i18n="menu">Menú</span>
    </button>
  </aside>

  <main id="map-wrap">
    <div id="map"></div>
    <div id="loading" class="loading" hidden><div class="spinner"></div><span id="loading-msg" data-i18n="loadingLayer">Cargando capa…</span></div>
    <div id="coords" class="coords" aria-live="off"></div>
    <div id="barra-desenho" class="barra-desenho" role="status" hidden></div>
  </main>
</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-geoman.js"></script>
<script src="data/meta.js?v=20261102b"></script>
<script src="js/i18n.js?v=20261102b"></script>
<script src="js/app.js?v=20261102b"></script>
<script src="js/validacao.js?v=20261102b"></script>
<script src="js/tutorial.js?v=20261102b"></script>
</body>
</html>
